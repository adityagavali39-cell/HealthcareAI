<!DOCTYPE html>
<html lang="en">
 
<head>
    
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Smart Healthcare Assistant</title>
 
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
 
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet">
 
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
      <link rel="stylesheet"
href="{{ url_for('static', filename='css/theme.css') }}">
</head>
 
<body>
     <button id="theme-btn" class="theme-btn">

                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>

            </button>
 
<div class="background-shape shape1"></div>
<div class="background-shape shape2"></div>
 
<div class="login-container">
 
    <div class="login-form">
 
        <div class="brand">
            <span class="brand-mark"></span>
            <span class="brand-name"> 🩺 Healthcare AI</span>
        </div>
 
        <div class="ecg-wrap" aria-hidden="true">
            <svg class="ecg" viewBox="0 0 600 60" preserveAspectRatio="none">
                <path class="ecg-line"
                      d="M0,30 L120,30 L145,30 L160,10 L180,50 L200,30 L230,30
                         L260,30 L280,15 L300,45 L320,30 L360,30
                         L600,30"
                      fill="none" />
            </svg>
        </div>
 
        <h2>Welcome back</h2>
        <p class="subtitle">Log in to continue to your dashboard</p>
 
        <form action="{{ url_for('login') }}" method="POST" novalidate>
 
            <div class="input-box">
                <i class="fa-solid fa-envelope icon-left"></i>
                <input
                    type="email"
                    name="email"
                    id="email"
                    placeholder="Enter email"
                    autocomplete="email"
                    required>
            </div>
 
            <div class="input-box password-box">
                <i class="fa-solid fa-lock icon-left"></i>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    required>
                <button type="button"
                        class="toggle-password"
                        id="togglePassword"
                        aria-label="Show password"
                        aria-pressed="false">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>
 
            <div class="options">
                <label>
                    <input type="checkbox" name="remember">
                    Remember me
                </label>
              <a href="{{ url_for('forgot_password') }}">
    Forgot Password?
</a>
            </div>
 
            <button type="submit" class="login-btn">
                <i class="fa-solid fa-right-to-bracket"></i>
                Log in
            </button>
 
            <div class="divider"><span>OR</span></div>
 
            <a href="{{ url_for('google_login') }}" class="google-btn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo">
                         Continue with Google
            </a>
 
            <div class="register">
                Don't have an account?
                <a href="{{ url_for('register') }}">Register</a>
            </div>
 
        </form>
 
    </div>
 
</div>
 
<script>
    // Toggle password visibility
    const togglePasswordBtn = document.getElementById("togglePassword");
    const passwordInput = document.getElementById("password");
 
    togglePasswordBtn.addEventListener("click", function () {
        const isHidden = passwordInput.type === "password";
        passwordInput.type = isHidden ? "text" : "password";
 
        const icon = this.querySelector("i");
        icon.classList.toggle("fa-eye");
        icon.classList.toggle("fa-eye-slash");
 
        this.setAttribute("aria-pressed", String(isHidden));
        this.setAttribute("aria-label", isHidden ? "Hide password" : "Show password");
    });
 
   
</script>

<script src="{{ url_for('static', filename='js/theme.js') }}?v=3"></script>
</body>
</html>
