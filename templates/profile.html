<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/profile.css') }}">

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet"
href="{{ url_for('static', filename='css/theme.css') }}">
</head>

<body>
<div class="theme-toggle">
    <button id="theme-btn">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
</div>
<div class="page">

  <div class="profile-card">

    <div class="card-header">
      <div class="avatar">{{ user["fullname"][0]|upper }}</div>
      <div class="header-text">
        <h1>{{ user["fullname"] }}</h1>
        <p class="subtitle">{{ user["email"] }}</p>
      </div>
    </div>

    <div class="divider"></div>

    <div class="info-grid">

      <div class="info-item">
        <span class="info-label">Full Name</span>
        <span class="info-value">{{ user["fullname"] }}</span>
      </div>

      <div class="info-item">
        <span class="info-label">Email</span>
        <span class="info-value">{{ user["email"] }}</span>
      </div>

      <div class="info-item">
        <span class="info-label">Age</span>
        <span class="info-value">{{ user["age"] }} yrs</span>
      </div>

      <div class="info-item">
        <span class="info-label">Gender</span>
        <span class="info-value">{{ user["gender"] }}</span>
      </div>

      <div class="info-item">
        <span class="info-label">Weight</span>
        <span class="info-value">{{ user["weight"] }} kg</span>
      </div>

      <div class="info-item">
        <span class="info-label">Blood Group</span>
        <span class="badge">{{ user["blood_group"] }}</span>
      </div>

    </div>

    <div class="action-row">
      <a href="/register"    class="action-link">
        <button class="btn-outline">Edit Profile</button>
      </a>
      <a href="/dashboard" class="action-link">
        <button class="btn-primary">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg>
          Back to Dashboard
        </button>
      </a>
    </div>

  </div>

</div>
<script src="{{ url_for('static', filename='js/theme.js') }}?v=3"></script>
</body>

</html>
